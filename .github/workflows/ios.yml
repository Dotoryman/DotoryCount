name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          simulator_id="$(
            xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          runtimes = json.load(sys.stdin)["devices"]
          iphones = [
              device
              for devices in runtimes.values()
              for device in devices
              if device["name"].startswith("iPhone") and device["isAvailable"]
          ]
          if not iphones:
              raise SystemExit("No available iPhone simulator found")
          print(iphones[0]["udid"])
          '
          )"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project DotoryCount.xcodeproj \
            -scheme DotoryCount \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:DotoryCountTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
